name: Test plugins

on: push

jobs:

  macos-test:
    name: Test mac universal plugins, csound 7
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v3

      - name: Check arm64
        run: |
          arch=$(uname -m)
          if [ "$arch" != "arm64" ]; then
            echo "Unexpected architecture: $arch"
            exit 1
          fi

      - name: Install csound 7 from source
        run: |
          git clone -b develop https://github.com/csound/csound --depth 1
          cd csound
          git submodule update --init --recursive
          brew install bison flex libmicrohttpd libogg flac lame libvorbis mpg123 opus libsndfile portaudio fluid-synth libaec libsamplerate aften liblo openblas portmidi jack
          cmake -B build -DBUILD_TESTS=OFF -DBUILD_RELEASE=ON -DBUILD_CSBEATS=OFF -DBUILD_DSSI_OPCODES=OFF -DBUILD_JAVA_INTERFACE=OFF -DBUILD_OSC_OPCODES=OFF -DBUILD_UTILITIES=OFF -DUSE_ALSA=0 -DUSE_AUDIOUNIT=1 -DUSE_CURL=0 -DUSE_COREMIDI=1 -DUSE_DOUBLE=1 -DUSE_GETTEXT=0 -DUSE_JACK=0 -DUSE_LIB64=1 -DUSE_MP3=0 -DUSE_PORTAUDIO=1 -DUSE_PORTMIDI=1 -DUSE_PULSEAUDIO=0 -DHAVEBIG_ENDIAN=0 -DFAIL_MISSING=OFF
          cmake --build build --config Release
          sudo cmake --install build
          csound --version

      - name: Install plugins
        run: |
          set -x
          ls -l
          csound --version
          which csound
          file $(which csound)
          # The publish job in build.yml re-uploads the 'latest' assets
          # concurrently with this job, so the asset may 404 while it is
          # being replaced. Wait for it instead of failing immediately.
          URL="https://github.com/csound-plugins/csound-plugins/releases/download/latest/plugins-csound7-macos-universal.zip"
          OK=0
          for i in $(seq 1 45); do
            rm -f plugins-csound7-macos-universal.zip
            if wget "$URL" && unzip -o plugins-csound7-macos-universal.zip; then
              OK=1
              break
            fi
            echo "Release asset not available yet (attempt $i/45), retrying in 60s..."
            sleep 60
          done
          if [ "$OK" != "1" ]; then
            echo "Failed to download $URL after 45 attempts"
            exit 1
          fi
          ls -l *.dylib
          PLUGINSDIR="$HOME/Library/csound/7.0/plugins64"
          mkdir -p "$PLUGINSDIR"
          cp *.dylib "$PLUGINSDIR"
          if [ -f macos-codesign.py ]; then
            echo "Trying to codesign plugins"
            python macos-codesign.py $PLUGINSDIR/*.dylib
          else
            echo "macos-codesign.py not found, plugins will not be codesigned"
          fi
          csound -z1 2>&1 || echo "\n\n--- finished ---"

      - name: Run tests
        run: |
          set -x
          mkdir -p artifacts
          # beosc
          pushd .
          cd src/beosc/examples
          csound --wave -o "beadsynt-macos-csound-7.wav" beadsynt.csd
          cp beadsynt*.wav ../../../artifacts
          popd
          ls artifacts/*

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-macos-universal-csound-7
          path: artifacts/*


  windows-test-release:
    name: Windows - Test released plugins on csound 7
    runs-on: windows-latest

    steps:
      - name: checkout
        uses: actions/checkout@v3

      - uses: lukka/get-cmake@v3.29.0

      # --- Optimized Csound 7 build (cache + parallel) ---

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Get Csound develop HEAD SHA
        id: csound-sha
        shell: bash
        run: |
          echo "sha=$(git ls-remote https://github.com/csound/csound refs/heads/develop | cut -f1)" >> $GITHUB_OUTPUT

      - name: Cache Csound build artifacts
        id: csound-cache
        uses: actions/cache@v4
        with:
          path: csound-build-artifacts
          key: csound-windows-develop-${{ steps.csound-sha.outputs.sha }}

      - name: Cache vcpkg downloads and packages
        if: steps.csound-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            csound/vcpkg/installed
            csound/vcpkg/downloads
          key: vcpkg-windows-${{ steps.csound-sha.outputs.sha }}
          restore-keys: vcpkg-windows-

      - name: Set up MSVC dev environment
        if: steps.csound-cache.outputs.cache-hit != 'true'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install csound 7 from source
        if: steps.csound-cache.outputs.cache-hit != 'true'
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
        run: |
          # The vcpkg cache restore may have placed files in csound/vcpkg/, making the
          # csound/ directory non-empty and causing git clone to fail. Move vcpkg data
          # out of the way, remove the directory, clone fresh, then restore vcpkg data.
          if (Test-Path "csound\vcpkg") {
            Move-Item "csound\vcpkg" "vcpkg-temp"
          }
          Remove-Item -Recurse -Force "csound" -ErrorAction SilentlyContinue
          git clone -b develop https://github.com/csound/csound --depth 1
          cd csound
          git submodule update --init --recursive
          if (Test-Path "..\vcpkg-temp") {
            Move-Item "..\vcpkg-temp" "vcpkg"
          }
          choco install -y winflexbison3
          .\vcpkg\bootstrap-vcpkg.bat
          cmake -B build -S . `
            -G "Ninja" `
            -DCMAKE_BUILD_TYPE=Release `
            -DBUILD_TESTS=0 `
            -DUSE_VCPKG=1 `
            -DBUILD_JAVA_INTERFACE=OFF `
            -DBUILD_INSTALLER=OFF `
            -DBUILD_DOCUMENTATION=OFF `
            -DUSE_PYTHON=OFF `
            -DUSE_LUA=OFF
          cmake --build build --parallel
          New-Item -Type Directory -Force ../csound-build-artifacts
          Get-ChildItem build -Filter "*.exe" | Copy-Item -Destination ../csound-build-artifacts
          Get-ChildItem build -Filter "*.dll" | Copy-Item -Destination ../csound-build-artifacts

      - name: Install Csound 7 (from cache or fresh build)
        run: |
          New-Item -Type Directory -Force "C:/Program Files/csound"
          cp csound-build-artifacts\* "C:/Program Files/csound"
          $machinePath = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine')
          [System.Environment]::SetEnvironmentVariable("PATH", $machinePath + ";C:/Program Files/csound", [EnvironmentVariableTarget]::Machine)
          $Env:Path = $Env:Path + ";C:/Program Files/csound"
          csound.exe --version

      # --- End Csound 7 build ---

      - name: Download and install plugins
        run: |
          $url = "https://github.com/csound-plugins/csound-plugins/releases/download/latest/plugins-csound7-windows.zip"
          $pluginsdir = "$env:LOCALAPPDATA\csound\7.0\plugins64"
          New-Item -Type Directory -Force "$pluginsdir"
          echo "Plugins dir: $pluginsdir"
          # The publish job in build.yml re-uploads the 'latest' assets
          # concurrently with this job, so the asset may 404 while it is
          # being replaced. Wait for it instead of failing immediately.
          # A 404 downloads a small HTML error page, which Expand-Archive
          # rejects, so a failed expand means "not ready yet".
          $downloaded = $false
          for ($i = 1; $i -le 45; $i++) {
            Remove-Item -Force plugins.zip -ErrorAction SilentlyContinue
            curl -L -o plugins.zip $url
            try {
              Expand-Archive plugins.zip -DestinationPath "$pluginsdir" -Force
              $downloaded = $true
              break
            } catch {
              echo "Release asset not available yet (attempt $i/45), retrying in 60s..."
              Start-Sleep -Seconds 60
            }
          }
          if (!$downloaded) {
            throw "Failed to download $url after 45 attempts"
          }
          Get-ChildItem -Recurse -Path "$pluginsdir"

      - name: Test plugins - Windows - Csound 7
        run: |
          $machinePath = [System.Environment]::GetEnvironmentVariable('PATH', 'Machine')
          $Env:Path = $Env:Path + ";C:/Program Files/csound"
          csound.exe --version
          New-Item -ItemType directory -Force artifacts
          cd src/beosc/examples
          csound.exe -o beadsynt.flac beadsynt.csd
          cp *.flac ../../../artifacts
          cd ../../klib/examples
          csound.exe --nosound dict_get.csd
          cd ../../else/examples
          csound.exe -o perlin3.flac perlin3-test.csd
          cp *.flac ../../../artifacts


  linuxgit:
    name: Test linux against csound git, branch develop
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04]
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: test
        if: runner.os == 'linux'
        run: |
          set -x
          sudo cp /etc/apt/sources.list /etc/apt/sources.list~
          sudo sed -Ei 's/^# deb-src /deb-src /' /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get build-dep csound
          sudo apt-get install cmake
          REPODIR=csound-develop
          git clone -b develop https://github.com/csound/csound.git $REPODIR
          cd $REPODIR
          mkdir build && cd build
          cmake ..
          cmake --build . --parallel
          sudo cmake --install .
          sudo ldconfig
          cd ../..
          sudo apt-get install libsndfile1-dev nasm
          git submodule update --init --recursive --remote
          git submodule status --recursive
          cd csound
          git switch develop
          cd ..
          rm -fr build-linux
          mkdir build-linux
          cd build-linux
          cmake -DSKIP_FAST_MATH=True ..
          cmake --build . --parallel
          cmake --install .
          cd ..
          bash test/linux-run-tests.sh

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-linux-git-${{ matrix.os }}
          path: artifacts/*
